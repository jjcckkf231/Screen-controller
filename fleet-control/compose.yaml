services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  server:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 4178
      DATABASE_URL: postgresql://fleet:${POSTGRES_PASSWORD}@database:5432/fleet
      FLEET_WORKER_TOKEN: ${FLEET_WORKER_TOKEN:?Set FLEET_WORKER_TOKEN in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:4178}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports: ["127.0.0.1:4178:4178"]
    volumes: ["files:/app/.data"]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: [npm, run, worker]
    environment:
      FLEET_API_URL: http://server:4178
      FLEET_WORKER_TOKEN: ${FLEET_WORKER_TOKEN:?Set FLEET_WORKER_TOKEN in .env}
    volumes: ["files:/app/.data"]
    depends_on: [server]
    init: true
    shm_size: 1gb
    restart: unless-stopped
volumes:
  database:
  files:
